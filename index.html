<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Emotion Recognition</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            background-color: #fff;\n            color: #333;\n            transition: background-color 0.5s, color 0.5s;\n        }\n        .dark-mode {\n            background-color: #333;\n            color: #fff;\n        }\n        .container {\n            max-width: 600px;\n            margin: 0 auto;\n            padding: 20px;\n        }\n        .card {\n            padding: 15px;\n            margin: 10px 0;\n            border-radius: 8px;\n            transition: background-color 0.3s;\n        }\n        .happy { background-color: #ffeb3b; }\n        .sad { background-color: #2196f3; }\n        .angry { background-color: #f44336; }\n        .neutral { background-color: #9e9e9e; }\n        button {\n            margin: 10px 0;\n            padding: 10px;\n            border: none;\n            border-radius: 5px;\n            cursor: pointer;\n        }\n    </style>\n</head>\n<body>\n    <div class="container">\n        <h1>Upload Emotion</h1>\n        <input type="file" id="emotionFile" accept="image/*">\n        <button id="toggleButton">Toggle Dark/Light Mode</button>\n        <div id="resultContainer"></div>\n    </div>\n    <script>\n        const toggleButton = document.getElementById('toggleButton');\n        const body = document.body;\n        const resultContainer = document.getElementById('resultContainer');\n        toggleButton.addEventListener('click', () => {\n            body.classList.toggle('dark-mode');\n        });\n        function displayEmotionResult(emotion) {\n            const card = document.createElement('div');\n            card.classList.add('card', emotion);\n            card.innerText = `Detected Emotion: ${emotion}`;\n            resultContainer.appendChild(card);\n        }\n    </script>\n</body>\n</html>
